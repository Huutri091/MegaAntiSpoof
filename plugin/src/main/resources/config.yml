# MegaAntiSpoof 1.0.0-SNAPSHOT - MEGACITYMC
# Mọi khoảng thời gian trong file này được tính theo tick (20 tick ≈ 1 giây).

debug:
  # In JSON đầy đủ của từng UPDATE_SIGN ra console dưới tiền tố SIGN-JSON.
  sign-response: true

dependencies:
  # Tự tải ProtocolLib 5.4.0 và PacketEvents 2.13.0 từ nguồn chính thức nếu thiếu.
  # Sau khi tải xong bắt buộc khởi động lại server; plugin không hot-load thư viện packet.
  auto-download: true
  # Có thể điền SHA-256 để khóa chặt artifact. Để rỗng vẫn kiểm tra HTTPS, kích thước và JAR magic.
  sha256:
    protocollib: ""
    packetevents: ""

check-on-join:
  # Tự động kiểm tra người chơi sau khi đăng nhập.
  enabled: true
  # Chờ client tải xong chunk trước khi mở challenge ẩn.
  delay-ticks: 80

challenge:
  # Thời gian tối đa đợi client trả UPDATE_SIGN cho mỗi nhóm chữ ký.
  timeout-ticks: 60
  # Khoảng nghỉ giữa hai nhóm để tránh burst packet trên Folia/Canvas.
  interval-ticks: 4
  # Nếu không nhận UPDATE_SIGN, gửi lại đúng batch này tối đa số lần dưới đây.
  max-retries: 20
  # Thời gian nghỉ giữa các lần gửi lại khi client không phản hồi.
  retry-interval-ticks: 10
  # Tự đóng Sign Editor sau khi mở. 1 tick giúp giao diện gần như không nhìn thấy.
  # Không đặt bằng 0 vì một số client chưa kịp khởi tạo màn hình để phân giải khóa.
  close-gui-delay-ticks: 1

actions:
  # Kick khi ít nhất một chữ ký mod cấm được phân giải.
  kick: true
  # Kick sau khi không phản hồi đủ số lần thử; không coi đây là phát hiện mod cụ thể.
  kick-on-no-response: true

punishment:
  # Tự động ban vĩnh viễn khi người chơi cố chấp vào lại server mà không gỡ mod cấm.
  ban-enabled: true
  # Số lần phát hiện vi phạm tối đa trước khi ban vĩnh viễn (mặc định: 3 lần).
  max-violations: 3
  # Tự động xóa số lần vi phạm khi người chơi gỡ mod và vượt qua kiểm tra (PASSED).
  reset-on-pass: true
  # Link Discord hỗ trợ/kháng cáo hiển thị trong thông báo kick và ban.
  discord-invite: "https://discord.gg/megacitymc"
  # Danh sách lệnh Console chạy khi người chơi vi phạm đạt giới hạn (lần thứ 3).
  # Hỗ trợ placeholders: {player}, {uuid}, {ip}, {mods}, {violations}, {max_violations}, {discord}
  # Bạn có thể thêm/bớt các dòng lệnh tùy thích:
  ban-commands:
    - "ban {player} Cố chấp sử dụng mod cấm ({mods}) quá {max_violations} lần. Kháng cáo: {discord}"


webhook:
  # Bật gửi kết quả PASSED/FAILED/PROTECTED/ERROR lên Discord.
  enabled: false
  # Tên máy chủ hiển thị trên webhook.
  server-name: "MegaCity #1"
  # Không chia sẻ URL webhook công khai hoặc commit URL thật vào Git.
  url: ""

# Mỗi khóa phải tồn tại trong gói ngôn ngữ của mod tương ứng.
# TRANSLATE đọc khóa dịch; KEYBIND đọc tên phím mà mod đăng ký.
